apiVersion: apps/v1
kind: Deployment
metadata:
  name: siam-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: siam-redis
  template:
    metadata:
      labels:
        app: siam-redis
    spec:
      containers:
      - name: redis
        image: redis:alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app: siam-redis
  ports:
  - protocol: TCP
    port: 6379
    targetPort: 6379
