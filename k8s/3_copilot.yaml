apiVersion: apps/v1
kind: Deployment
metadata:
  name: siam-copilot-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: siam-copilot
  template:
    metadata:
      labels:
        app: siam-copilot
    spec:
      containers:
      - name: copilot
        image: siam-food-copilot:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: siam-copilot-secrets
              key: GEMINI_API_KEY
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: siam-copilot-service
spec:
  type: LoadBalancer
  selector:
    app: siam-copilot
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8000
