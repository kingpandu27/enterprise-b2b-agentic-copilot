name: Siam Food Copilot Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  agent-evaluations:
    name: Run LangGraph Evals & Guardrail Benchmarks
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Commercial Guardrail & Accuracy Evals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest test_evals.py -v --junitxml=eval-results.xml

      - name: Build & Package Docker Image
        run: |
          docker build -t siam-food-copilot:${{ github.sha }} .
          docker tag siam-food-copilot:${{ github.sha }} siam-food-copilot:latest
